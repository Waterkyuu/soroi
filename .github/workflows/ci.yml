name: CI

on:
  workflow_call:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Keep lint on a toolchain supported by the pinned analyzer.
          go-version: '1.25.x'
          cache: false
      - run: go mod verify
      - name: Check release automation
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sh .github/scripts/release_test.sh
          sh .github/scripts/dependabot_merge_test.sh
      - name: Check module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: Check formatting
        run: |
          golangci-lint fmt
          git diff --exit-code

  bubbletea:
    name: Bubble Tea example
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/bubbletea
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: examples/bubbletea/go.sum
      - run: go mod verify
      - name: Check example module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: go build -o "$RUNNER_TEMP/soroi-bubbletea" .

  mcp:
    name: MCP example
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache-dependency-path: examples/mcp/go.sum
      - run: go mod verify
      - name: Check example module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - run: go test -race ./... -count=1
      - run: go build -o "$RUNNER_TEMP/soroi-mcp" .
      - run: go run .

  integrations:
    name: Integration example (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [examples/service, benchmarks/scenarios]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: go mod verify
      - name: Check module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ matrix.module }}
          args: --config ../../.golangci.yml --timeout=5m
      - run: go test -race ./... -count=1
      - run: go build -o "$RUNNER_TEMP/soroi-integration" .
      - name: Run HTTP and gRPC demonstration
        if: matrix.module == 'examples/service'
        run: go run .
      - name: Run workload smoke check
        if: matrix.module == 'benchmarks/scenarios'
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          go run . -requests 64 -workers 8 -max-concurrent 2 > "$RUNNER_TEMP/soroi-workloads.jsonl"

  redis:
    name: Redis shared store
    runs-on: ubuntu-latest
    env:
      SOROI_REQUIRE_REDIS: '1'
    defaults:
      run:
        working-directory: store/redis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: store/redis/go.sum
      - name: Install local integration-test server
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          command -v redis-server
      - run: go mod verify
      - name: Check adapter module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: store/redis
          args: --config ../../.golangci.yml --timeout=5m
      - run: go test -race ./... -count=1
      - run: go build ./...

      - name: Check Redis example module
        working-directory: examples/redis
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test -race ./... -count=1
          go build ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: examples/redis
          args: --config ../../.golangci.yml --timeout=5m
      - name: Run Redis examples
        working-directory: examples/redis
        env:
          REDIS_ADDR: 127.0.0.1:16379
        run: |
          redis-server --bind 127.0.0.1 --port 16379 --save '' --appendonly no &
          redis_pid=$!
          trap 'kill "$redis_pid"; wait "$redis_pid" || true' EXIT
          for _ in {1..50}; do
            if redis-cli -h 127.0.0.1 -p 16379 ping >/dev/null 2>&1; then
              break
            fi
            sleep 0.1
          done
          redis-cli -h 127.0.0.1 -p 16379 ping
          go run ./shared_cache
          go run ./shared_invalidation
          go run ./failure_protection

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22.x', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Enable Mach-O UUIDs for Go 1.22 on macOS
        if: runner.os == 'macOS' && matrix.go == '1.22.x'
        # New macOS loaders require LC_UUID; Go 1.22 only emits it with -B.
        run: echo 'GOFLAGS=-ldflags=-B=gobuildid' >> "$GITHUB_ENV"
      - name: Run tests
        run: go test -race ./... -count=1 -coverprofile=coverage.out
      - run: go tool cover -func=coverage.out
      - run: go build ./...
